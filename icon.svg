<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A84FF"/>
      <stop offset="1" stop-color="#5E5CE6"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background (safe for maskable + iOS) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- clock face -->
  <circle cx="256" cy="256" r="150" fill="#ffffff"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#000000" stroke-opacity="0.06" stroke-width="6"/>

  <!-- hour ticks -->
  <g stroke="#1c2a52" stroke-width="7" stroke-linecap="round">
    <line x1="256" y1="118" x2="256" y2="134" transform="rotate(0 256 256)"/>
    <line x1="256" y1="118" x2="256" y2="132" transform="rotate(30 256 256)"/>
    <line x1="256" y1="118" x2="256" y2="132" transform="rotate(60 256 256)"/>
    <line x1="256" y1="118" x2="256" y2="134" transform="rotate(90 256 256)"/>
    <line x1="256" y1="118" x2="256" y2="132" transform="rotate(120 256 256)"/>
    <line x1="256" y1="118" x2="256" y2="132" transform="rotate(150 256 256)"/>
    <line x1="256" y1="118" x2="256" y2="134" transform="rotate(180 256 256)"/>
    <line x1="256" y1="118" x2="256" y2="132" transform="rotate(210 256 256)"/>
    <line x1="256" y1="118" x2="256" y2="132" transform="rotate(240 256 256)"/>
    <line x1="256" y1="118" x2="256" y2="134" transform="rotate(270 256 256)"/>
    <line x1="256" y1="118" x2="256" y2="132" transform="rotate(300 256 256)"/>
    <line x1="256" y1="118" x2="256" y2="132" transform="rotate(330 256 256)"/>
  </g>

  <!-- hands (10:10) -->
  <line x1="256" y1="256" x2="191" y2="218" stroke="#1c2a52" stroke-width="16" stroke-linecap="round"/>
  <line x1="256" y1="256" x2="351" y2="201" stroke="#1c2a52" stroke-width="13" stroke-linecap="round"/>
  <!-- second hand accent -->
  <line x1="256" y1="256" x2="232" y2="338" stroke="#FF9500" stroke-width="7" stroke-linecap="round"/>

  <!-- center cap -->
  <circle cx="256" cy="256" r="15" fill="#1c2a52"/>
  <circle cx="256" cy="256" r="6" fill="#ffffff"/>
</svg>
